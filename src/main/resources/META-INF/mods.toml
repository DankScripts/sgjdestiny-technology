modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sgjourney"
mandatory=true
versionRange="[0.6.48,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="immersive_portals"
mandatory=true
versionRange="[3.0.7,3.1.0)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sgj_deco"
mandatory=false
versionRange="[1.2.0,)"
ordering="AFTER"
side="BOTH"

# Distant Horizons discovers both SGJourney-owned planet dimensions normally.
# Loading this mod after DH when present ensures the Water Planet's startup terrain
# preparation is registered before a client begins building its LOD database.
[[dependencies.${mod_id}]]
modId="distanthorizons"
mandatory=false
versionRange="[2.2.0,)"
ordering="AFTER"
side="CLIENT"
