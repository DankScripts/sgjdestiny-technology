plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "sgjdestiny-tech-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly files('libs/immersive-portals-3.0.7-all.jar')

    def configuredSgJourneyJar = System.getenv('SGJOURNEY_JAR')
    if (configuredSgJourneyJar != null && !configuredSgJourneyJar.isBlank()) {
        compileOnly files(configuredSgJourneyJar)
    } else {
        compileOnly files('libs/Stargate.Journey-1.20.1-0.6.48-hotfix1.jar')
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "sgjdestiny-tech-${minecraft_version}-${mod_version}.jar"
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'sgjdestiny_dhd.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjdestiny-tech-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.projectDirectory) {
        include 'src/**'
        include 'blockbench/**'
        include 'tools/**'
        include 'gradle/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'build.gradle'
        include 'settings.gradle'
        include 'gradle.properties'
        include 'README.md'
        include 'CHANGELOG.md'
        include 'BASELINE.md'
        include 'LICENSE.txt'
        include '.gitignore'
        include '.gitattributes'
        exclude 'tools/build-transformer/**'
    }
}

tasks.register('release') {
    dependsOn 'build', 'sourceArchive'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
