plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "sgjdestiny-tech-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly files('libs/immersive-portals-3.0.7-all.jar')

    def configuredSgJourneyJar = System.getenv('SGJOURNEY_JAR')
    if (configuredSgJourneyJar != null && !configuredSgJourneyJar.isBlank()) {
        compileOnly files(configuredSgJourneyJar)
    } else {
        compileOnly files('libs/Stargate.Journey-1.20.1-0.6.50.jar')
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version_range: forge_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
    ]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

tasks.register('verifyShuttleMaterials') {
    def model = file('src/main/resources/assets/sgjdestiny_dhd/models/block/destiny_shuttle_dev.obj')
    def materials = file('src/main/resources/assets/sgjdestiny_dhd/models/block/destiny_shuttle_dev.mtl')
    inputs.files(model, materials)
    doLast {
        def used = [] as Set
        def defined = [] as Set
        model.eachLine { line ->
            if (line.startsWith('usemtl ')) used.add(line.substring(7).trim())
        }
        materials.eachLine { line ->
            if (line.startsWith('newmtl ')) defined.add(line.substring(7).trim())
            if (line.startsWith('map_Kd ')) {
                def textureId = line.substring(7).trim().split(':', 2)
                if (textureId.length != 2) throw new GradleException("Invalid shuttle texture: ${line}")
                def texture = file("src/main/resources/assets/${textureId[0]}/textures/${textureId[1]}.png")
                if (!texture.isFile()) throw new GradleException("Missing shuttle texture: ${texture}")
            }
        }
        def missing = used - defined
        if (!missing.empty) throw new GradleException("Undefined shuttle materials: ${missing.sort()}")
    }
}

tasks.named('processResources').configure { dependsOn 'verifyShuttleMaterials' }

tasks.named('jar', Jar).configure {
    archiveFileName = "sgjdestiny-tech-${minecraft_version}-${mod_version}.jar"
    manifest {
        attributes([
            'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors,
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': mod_version,
            'Implementation-Vendor': mod_authors,
            'MixinConfigs': 'sgjdestiny_dhd.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjdestiny-tech-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.projectDirectory) {
        include 'src/**'
        include 'blockbench/**'
        include 'tools/**'
        include 'corridor-work/stargate-universe-destiny-corridor-original.stl'
        include 'gradle/**'
        include 'gradlew'
        include 'gradlew.bat'
        include 'build.gradle'
        include 'settings.gradle'
        include 'gradle.properties'
        include 'README.md'
        include 'CHANGELOG.md'
        include 'BASELINE.md'
        include 'LICENSE.txt'
        include '.gitignore'
        include '.gitattributes'
        exclude 'tools/build-transformer/**'
        exclude 'blockbench/shuttle/private_reference/**'
        exclude 'blockbench/shuttle/*preview*/**'
        exclude 'blockbench/shuttle/paint_stencil_markup/**'
    }
}

tasks.register('release') {
    dependsOn 'build', 'sourceArchive'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('compileElevatorMotionTest', JavaCompile) {
    source = files('tools/tests/LiftMotionTest.java', 'src/main/java/com/dankscripts/sgjdestiny_dhd/elevator/LiftMotion.java')
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('elevator-tests')
}
tasks.register('verifyElevatorMotion', JavaExec) {
    dependsOn 'compileElevatorMotionTest'
    classpath = files(layout.buildDirectory.dir('elevator-tests'))
    mainClass = 'com.dankscripts.sgjdestiny_dhd.elevator.LiftMotionTest'
}
tasks.named('check').configure { dependsOn 'verifyElevatorMotion' }
