plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.106'
}

version = mod_version
group = mod_group_id
base { archivesName = "sgjdestiny-tech-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
}

configurations {
    externalMods
}

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}

dependencies {
    def configuredSgJourneyJar = System.getenv('SGJOURNEY_JAR')
    def sgJourneyJar = configuredSgJourneyJar != null && !configuredSgJourneyJar.isBlank()
            ? configuredSgJourneyJar
            : 'libs/Stargate.Journey-1.21.1-0.6.55-alpha.jar'
    implementation files(sgJourneyJar)
    // iPortalTeam's NeoForge 1.21.1 build. Its runtime mod id is
    // immersive_portals_core (not immersive_portals).
    implementation 'curse.maven:immersive-portals-for-forge-355440:6667779'
    externalMods files(sgJourneyJar)
    externalMods 'curse.maven:immersive-portals-for-forge-355440:6667779'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.named('processResources', ProcessResources).configure {
    inputs.property('neoShipResourceLayout', '2')
    filesMatching('data/sgjdestiny_dhd/structures/destiny_ship/*.nbt') {
        path = path.replace('data/sgjdestiny_dhd/structures/', 'data/sgjdestiny_dhd/structure/')
    }
    filesMatching('assets/sgjdestiny_dhd/models/**/*.json') {
        filteringCharset = 'UTF-8'
        filter { line -> line.replace('"forge:obj"', '"neoforge:obj"').replace('"forge_data"', '"neoforge_data"') }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        ])
    }
}

tasks.register('sourceArchive', Zip) {
    archiveFileName = "sgjdestiny-tech-${minecraft_version}-${mod_version}-source.zip"
    destinationDirectory = layout.projectDirectory.dir('dist')
    from(projectDir) {
        include 'src/**', 'blockbench/**', 'tools/**', 'gradle/**', 'gradlew', 'gradlew.bat',
                'build.gradle', 'settings.gradle', 'gradle.properties', 'README.md', 'CHANGELOG.md',
                'BUILDING.md', 'LICENSE.txt', 'BASELINE.md'
        exclude 'blockbench/shuttle/private_reference/**'
        exclude 'blockbench/shuttle/*preview*/**'
        exclude 'blockbench/shuttle/paint_stencil_markup/**'
    }
}

tasks.register('releaseJar', Copy) {
    dependsOn 'build'
    from(tasks.named('jar'))
    into(layout.projectDirectory.dir('dist'))
}

tasks.register('copyCompileDependencies', Copy) {
    from(configurations.externalMods)
    into(layout.buildDirectory.dir('deps'))
}

